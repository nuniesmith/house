# ============================================================================
# FloorPlan Designer — Docker Compose
# ============================================================================
# Builds the 2-stage Dockerfile (test → runtime) and runs the container
# with nginx serving static files + FastAPI on port 80.
#
# Usage:
#   docker compose up --build        # Build and start
#   docker compose up -d             # Detached mode
#   docker compose logs -f           # Follow logs
#   docker compose down              # Stop and remove
# ============================================================================

services:
    floorplan:
        build:
            context: .
            dockerfile: docker/Dockerfile
        container_name: floorplan-designer
        ports:
            - "${PORT:-8666}:80"
        volumes:
            # Mount config for live editing without rebuild
            - ./config.yaml:/app/config.yaml:ro
            # Persist generated output on the host
            - ./output:/app/output
            # Mount HTML source for live front-end development
            - ./src/html:/usr/share/nginx/html:ro
            # Mount nginx config for live tweaks
            - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        environment:
            - CONFIG_PATH=/app/config.yaml
            - OUTPUT_PATH=/app/output
            - API_PORT=5000
            - MPLBACKEND=Agg
            - PYTHONUNBUFFERED=1
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "-f",
                    "http://localhost/",
                    "&&",
                    "curl",
                    "-f",
                    "http://localhost/api/health",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
