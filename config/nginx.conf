# ============================================================================
# FloorPlan Designer — nginx configuration
# ============================================================================
# • Serves the static HTML/CSS/JS front-end on port 80
# • Proxies /api/* requests to the FastAPI back-end on port 5000
# • Custom error pages for 404 and 50x errors
# ============================================================================

server {
    listen       80;
    server_name  localhost;

    # ------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # Static front-end
    # ------------------------------------------------------------------
    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # HTML should be revalidated
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }

    # ------------------------------------------------------------------
    # API reverse proxy  →  FastAPI on 127.0.0.1:5000
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Generous timeouts — floor-plan generation can take a few seconds
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # Allow large config uploads
        client_max_body_size 10m;

        # Disable buffering so streamed responses arrive promptly
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # Serve generated output files (PNG / SVG / PDF)
    # ------------------------------------------------------------------
    location /output/ {
        alias /app/output/;
        autoindex on;
        autoindex_format json;

        # Allow browser to cache generated images for a short time
        expires 1h;
        add_header Cache-Control "public";
    }

    # ------------------------------------------------------------------
    # Error pages
    # ------------------------------------------------------------------
    error_page 404             /errors.html;
    error_page 500 502 503 504 /errors.html;

    location = /errors.html {
        internal;
        root /usr/share/nginx/html;
    }

    # ------------------------------------------------------------------
    # Deny access to hidden files (e.g. .git, .env)
    # ------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ------------------------------------------------------------------
    # Gzip compression
    # ------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/svg+xml
        image/svg+xml;
}
