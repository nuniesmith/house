# =============================================================================
# BASEMENT FLOOR PLAN - Corrected to the hand-drawn sketch (2026-10-27)
# =============================================================================
# - 100' x 60' ICF foundation (see foundation: below), 12' ceilings.
# - The sketch's five doors are now defined (the old data had none).
# - The exit stairs are the sketch's attached tower OUTSIDE the east
#   foundation wall (~30-40' of run at the north end), not a full-height
#   strip inside the 100' width.
# - The bar is a freestanding counter (furniture), not a walled room.
# - The bottom band follows the sketch's segments: pool 25' + hall 5' +
#   open floor + the ~54' storage/rec block.
# =============================================================================
basement:
    figure:
        width: 20
        height: 14
        title: "Basement Floor Plan - Phase 1 Rough-In"
        x_min: -5
        x_max: 115
        y_min: -5
        y_max: 70

