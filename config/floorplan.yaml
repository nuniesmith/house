#   nook/porch, bar, front hall, powder room, Bath 2/3 and their WICs, the
#   office/master/side porches and the second master WIC.
# - Enclosed-room rectangles use the dimensions printed on the plan;
#   dimension_text quotes the plan exactly. Open-plan zones (kitchen,
#   family room, halls) are rectangles fitted between their neighbours,
#   so a zone rectangle can differ slightly from its printed clear
#   dimension. Rectangles are schematic, not construction geometry.
# - ceiling_ft / vaulted come from the plan's ceiling notes (12' bedroom
#   wing, 14' front rooms, vaulted family/master/outdoor living).
# - Doors use the OpenSCAD convention: direction up/down = the opening
#   sits in a horizontal wall and spans x; left/right = vertical wall,
