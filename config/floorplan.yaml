        x: 50
        y: 65
        fontsize: 9
        style: italic
        color: gray

    north_arrow:
        x: 106
        y: 62
        size: 6

    # ICF foundation footprint (the exit-stair tower sits outside it)
    foundation:
        x: 0
        y: 0
        width: 100
        height: 60

