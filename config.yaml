# =============================================================================
# BASEMENT FLOOR PLAN - Ultra-Precise (100' x 60' ICF Foundation)
# =============================================================================
# Layout from hand-drawn sketch with precise decimal coordinates:
# - Total: 100.00' wide x 60.00' tall
# =============================================================================
basement:
    figure:
        width: 20
        height: 14
        title: "Basement Floor Plan - Phase 1 Rough-In"
        x_min: -5
        x_max: 110
        y_min: -5
        y_max: 70

    dimensions:
        width_label: "100'"
        height_label: "60'"
        width_arrow_y: -5
        height_arrow_x: -3

    ceiling_note:
        text: "12' Ceilings Throughout - ICF Foundation - PHASE 1: ROUGH-IN ONLY"
        x: 50
        y: 65
        fontsize: 9
        style: italic
        color: gray

    north_arrow:
        x: 100
        y: 62
        size: 6

    # =========================================================================
    # ROOMS
    # =========================================================================
    rooms:
        # --- LEFT SECTION ---
        # Pool / Hot Tub (Bottom Left)
        - x: 0
          y: 0
          width: 25
          height: 35
          label: "POOL / HOT TUB"
          color: pool_area
          linewidth: 3
          auto_dimension: true
          dimension_text: "25' x 35'"

        # Home Theater (Top Left)
        - x: 0
          y: 35
          width: 30
          height: 25
          label: "HOME\nTHEATER"
          color: theater
          label_color: white
          linewidth: 3
          auto_dimension: true
          dimension_text: "30' x 25'"

        # --- CENTER / TOP ROW ---
        # Utilities
        - x: 30
          y: 45
          width: 40
          height: 15
          label: "UTILITIES"
          color: utility
          linewidth: 3

        # Stairs Up
        - x: 70
          y: 45
          width: 20
          height: 15
          label: "STAIRS UP"
          color: hammock # Using hammock color for wood look
          linewidth: 3

        # --- CENTER / OPEN AREA ---
        # Open Rec Area
        - x: 25
          y: 20
          width: 65
          height: 25
          label: "OPEN REC AREA"
          color: living
          linewidth: 3

        # Storage / Rec (Bottom Center)
        - x: 30
          y: 0
          width: 60
          height: 20
          label: "STORAGE / REC"
          color: storage
          linewidth: 3

        # --- FEATURES ---
        # Bar
        - x: 65
          y: 25
          width: 10
          height: 6
          label: "BAR"
          color: bar
          label_color: white
          linewidth: 3

        # --- FAR RIGHT ---
        # Exit Stairs
        - x: 90
          y: 0
          width: 10
          height: 60
          label: "STAIRS EXIT"
          color: hammock
          linewidth: 3

    theater:
        room:
            x: 0
            y: 35
            width: 30
            height: 25
            label: "Home Theater"
            color: theater
            label_fontsize: 12
        seating: []

    pool:
        area:
            x: 0
            y: 0
            width: 25
            height: 35
            color: pool_area
            label: ""
        hot_tub:
            x: 10
            y: 10
            radius: 0
            color: spa
            edge_color: "#0288d1"
            label: ""
        spa_label:
            x: 0
            y: 0
            text: ""

    doors: []
    stairs: []
    furniture: []
    text_annotations: []
    line_annotations: []
